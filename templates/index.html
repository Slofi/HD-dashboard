<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hand-Deck</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --accent: #e8b04f;
            --accent-border-faint: rgba(232,176,79,0.10);
            --accent-border-mid:   rgba(232,176,79,0.30);
            --accent-bg-faint:     rgba(232,176,79,0.07);
            --accent-bg-mid:       rgba(232,176,79,0.12);
            --accent-muted:        #a87830;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(160deg, #0a0a12 0%, #12121f 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e0e8ff;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            height: 52px;
            border-bottom: 1px solid var(--accent-border-faint);
            flex-shrink: 0;
        }

        header h1 {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent);
            cursor: pointer;
            touch-action: manipulation;
        }

        header h1 i { margin-right: 10px; font-size: 0.85rem; }

        #clock {
            font-size: 1.8rem;
            font-weight: 700;
            color: #e0e8ff;
            letter-spacing: 0.04em;
            text-align: right;
            line-height: 1;
        }

        #date {
            font-size: 0.7rem;
            color: var(--accent-muted);
            text-align: right;
            margin-top: 3px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: 108px 1fr 1fr;
            gap: 12px;
            padding: 12px 24px;
            height: calc(100vh - 52px);
        }

        .card {
            background: rgba(255,255,255,0.035);
            border: 1px solid var(--accent-border-faint);
            border-radius: 20px;
            padding: 0 20px;
            text-align: center;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
            backdrop-filter: blur(10px);
            position: relative;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        /* OM tile spans full width — primary app */
        .card.primary {
            grid-column: 1 / -1;
            flex-direction: row;
            gap: 24px;
            justify-content: center;
        }

        .card.primary i,
        .card.primary .card-label {
            margin: 0;
        }

        .card.primary i { font-size: 2.4rem; }
        .card.primary .card-label { font-size: 1.1rem; }

        .om-mask {
            width: 3.2rem;
            height: 3.2rem;
            background-color: var(--accent);
            -webkit-mask-image: url(/static/overmesh.png);
            mask-image: url(/static/overmesh.png);
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            transition: background-color 0.3s;
        }

        .card:active {
            transform: scale(0.97);
            background: var(--accent-bg-mid);
            border-color: var(--accent-border-mid);
        }

        .card i {
            font-size: 2.6rem;
            color: var(--accent);
            margin-bottom: 16px;
            display: block;
        }

        .card-label {
            font-size: 1rem;
            font-weight: 500;
            color: #b0c4e8;
            letter-spacing: 0.05em;
        }

        .status-dot {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #1e2235;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .status-dot.online {
            background: #3ddc84;
            box-shadow: 0 0 8px rgba(61,220,132,0.6);
        }

        .card-stop-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: none;
            border: none;
            color: rgba(255,100,100,0.28);
            font-size: 13px;
            cursor: pointer;
            z-index: 2;
            padding: 6px;
            line-height: 1;
            transition: color 0.15s;
            touch-action: manipulation;
        }

        .card-stop-btn:active { color: #ff6060; }


        /* Settings panel */
        #settings-panel {
            position: fixed;
            top: 52px;
            left: 16px;
            width: 280px;
            background: #14141f;
            border: 1px solid var(--accent-border-mid);
            border-radius: 18px;
            padding: 22px;
            z-index: 99;
            display: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            /* Cap to viewport + touch-scroll so the lower rows are reachable on the 5" screen */
            max-height: calc(100vh - 68px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #settings-panel.open { display: block; }

        #settings-panel h3 {
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent-muted);
            margin-bottom: 18px;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .setting-row label { font-size: 0.85rem; color: #b0c4e8; }

        .color-swatches {
            display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;
        }

        .color-swatch {
            width: 28px; height: 28px; border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
            touch-action: manipulation;
        }

        .color-swatch:active { transform: scale(1.2); }
        .color-swatch.active { border-color: #fff; }

        .color-hex-row {
            display: flex; align-items: center; gap: 6px; margin-top: 10px;
        }

        .color-hex-row input[type="text"] {
            width: 86px; font-size: 0.8rem; font-family: monospace;
            background: rgba(255,255,255,0.06); border: 1px solid var(--accent-border-mid);
            border-radius: 6px; color: #e0e8ff; padding: 6px 8px;
        }

        .color-hex-row button {
            font-size: 0.75rem; padding: 6px 10px;
            background: var(--accent-bg-mid); border: 1px solid var(--accent-border-mid);
            border-radius: 6px; color: var(--accent); cursor: pointer;
            touch-action: manipulation;
        }

        .setting-reset {
            font-size: 0.74rem; color: var(--accent-muted);
            cursor: pointer; text-decoration: underline;
            background: none; border: none; touch-action: manipulation;
        }

        #shutdown-countdown {
            font-size: 0.8rem; color: #ff8080; margin-top: 4px; display: none;
        }

        .shutdown-row {
            display: flex; gap: 6px; margin-top: 8px;
        }

        .shutdown-row input[type="number"] {
            width: 62px; background: #1a2235; border: 1px solid #2a3550;
            color: #e8f0ff; border-radius: 6px; padding: 6px 8px; font-size: 0.84rem;
        }

        .shutdown-row button {
            flex: 1; border: none; border-radius: 6px;
            padding: 6px 8px; font-size: 0.84rem; cursor: pointer;
            touch-action: manipulation;
        }

        #shutdown-set-btn { background: #2a3550; color: #e8f0ff; }
        #shutdown-cancel-btn { background: #3d1a1a; border: 1px solid #663333; color: #ff8080; display: none; }
        #gps-dot.fix  { background: #3ddc84; box-shadow: 0 0 6px rgba(61,220,132,0.6); }
        #gps-dot.nofix { background: #ff5050; }
    </style>
</head>
<body>
    <header>
        <h1 onclick="toggleSettings()"><i class="fa-solid fa-tablet-screen-button"></i>Hand-Deck</h1>
        <div>
            <div id="clock">--:--</div>
            <div id="date">---</div>
        </div>
            <div id="gps-badge" style="display:flex;align-items:center;gap:5px;margin-top:3px;">
                <span id="gps-dot" style="width:8px;height:8px;border-radius:50%;background:#1e2235;flex-shrink:0;transition:background 0.3s,box-shadow 0.3s;"></span>
                <span style="font-size:0.7rem;letter-spacing:0.06em;color:#7a8aaa;text-transform:uppercase;">GPS</span>
                <span id="gps-sats" style="font-size:0.68rem;color:#7a8aaa;"></span>
            </div>
    </header>

    <div class="grid">
        {% for app in apps %}
        <div class="card{% if app.id == 'overmesh' %} primary{% endif %}{% if not app.cmd and not app.get('special') %} disabled{% endif %}"
             id="card-{{ app.id }}"
             onclick="{% if app.get('special') == 'stop-all' %}stopAll(this){% elif app.get('href') %}window.location='{{ app.href }}'{% else %}launch('{{ app.id }}', {{ 'true' if app.cmd else 'false' }}){% endif %}">

            {% if app.status_port %}
            <span class="status-dot" id="dot-{{ app.id }}"></span>
            {% endif %}

            {% if app.id == 'overmesh' %}
            <div class="om-mask"></div>
            {% elif app.icon_img %}
            <img src="{{ app.icon_img }}" style="width:2.6rem;height:2.6rem;object-fit:contain">
            {% else %}
            <i class="fa-solid {{ app.icon }}"></i>
            {% endif %}
            {% if app.label %}<div class="card-label">{{ app.label }}</div>{% endif %}

            {% if app.stoppable %}
            <button class="card-stop-btn"
                    onclick="event.stopPropagation(); stopApp('{{ app.id }}', this)"
                    title="Stop">
                <i class="fa-solid fa-xmark"></i>
            </button>
            {% endif %}
        </div>
        {% endfor %}
    </div>

    <div id="settings-panel">
        <h3>Settings</h3>

        <div style="margin-bottom:18px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <label style="font-size:0.85rem;color:#b0c4e8;">Accent colour</label>
                <button class="setting-reset" onclick="resetAccentColor()">Reset</button>
            </div>
            <div class="color-swatches" id="color-swatches"></div>
            <div class="color-hex-row">
                <input type="text" id="accent-hex" maxlength="7" placeholder="#4ab8de" spellcheck="false">
                <button onclick="applyHexInput()">Apply</button>
            </div>
        </div>

        <div style="margin-bottom:18px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <label style="font-size:0.85rem;color:#b0c4e8;">Brightness</label>
                <span id="brightness-val" style="font-size:0.8rem;color:#7a8aaa;">100%</span>
            </div>
            <input type="range" id="brightness-slider" min="20" max="100" value="100"
                   style="width:100%;margin-top:8px;accent-color:var(--accent);"
                   oninput="onBrightnessSlider(this.value)"
                   onchange="applyBrightness(this.value)">
        </div>


        <div style="margin-bottom:18px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <label style="font-size:0.85rem;color:#b0c4e8;">Network</label>
                <span id="cdap-ssid" style="font-size:0.78rem;color:#7a8aaa;"></span>
            </div>
            <button id="cdap-btn" onclick="toggleCdap()"
                style="width:100%;padding:9px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#e8f0ff;font-size:0.82rem;cursor:pointer;transition:background 0.15s,border-color 0.15s;">
                Connect to CD-AP
            </button>
            <div id="cdap-msg" style="font-size:0.75rem;color:#7a8aaa;margin-top:5px;text-align:center;min-height:1em;"></div>
        </div>

        <div>
            <label style="font-size:0.85rem;color:#b0c4e8;">Shutdown timer</label>
            <div id="shutdown-countdown"></div>
            <div class="shutdown-row">
                <input type="number" id="shutdown-minutes" min="1" max="480" placeholder="min">
                <button id="shutdown-set-btn" onclick="setShutdownTimer()">Set</button>
                <button id="shutdown-cancel-btn" onclick="cancelShutdownTimer()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_ACCENT = '#4ab8de';

        function hexToRgb(hex) {
            return [
                parseInt(hex.slice(1,3), 16),
                parseInt(hex.slice(3,5), 16),
                parseInt(hex.slice(5,7), 16)
            ];
        }

        function applyAccentColor(hex) {
            const [r, g, b] = hexToRgb(hex);
            const root = document.documentElement;
            root.style.setProperty('--accent', hex);
            root.style.setProperty('--accent-border-faint', `rgba(${r},${g},${b},0.10)`);
            root.style.setProperty('--accent-border-mid',   `rgba(${r},${g},${b},0.30)`);
            root.style.setProperty('--accent-bg-faint',     `rgba(${r},${g},${b},0.07)`);
            root.style.setProperty('--accent-bg-mid',       `rgba(${r},${g},${b},0.12)`);
            root.style.setProperty('--accent-muted', `rgba(${Math.round(r*0.6)},${Math.round(g*0.6)},${Math.round(b*0.6)},1)`);
            document.getElementById('accent-hex').value = hex;
            document.querySelectorAll('.color-swatch').forEach(s =>
                s.classList.toggle('active', s.dataset.color === hex)
            );
            localStorage.setItem('hd_accent', hex);
            fetch('/accent', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({color: hex})}).catch(()=>{});
        }

        function applyHexInput() {
            const v = document.getElementById('accent-hex').value.trim();
            if (/^#[0-9a-fA-F]{6}$/.test(v)) applyAccentColor(v);
        }

        function resetAccentColor() { applyAccentColor(DEFAULT_ACCENT); }

        const ACCENT_PRESETS = [
            '#4ab8de','#deaf4a','#e06c75','#98c379',
            '#c678dd','#56b6c2','#d19a66','#ffffff',
        ];

        function buildSwatches() {
            const container = document.getElementById('color-swatches');
            const current = localStorage.getItem('hd_accent') || DEFAULT_ACCENT;
            ACCENT_PRESETS.forEach(c => {
                const s = document.createElement('span');
                s.className = 'color-swatch' + (c === current ? ' active' : '');
                s.style.background = c;
                s.dataset.color = c;
                s.title = c;
                s.onclick = () => applyAccentColor(c);
                container.appendChild(s);
            });
        }

        function onBrightnessSlider(v) {
            document.getElementById('brightness-val').textContent = v + '%';
        }

        function applyBrightness(v) {
            localStorage.setItem('hd_brightness', v);
            fetch('/brightness', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({value: parseInt(v) / 100})
            }).catch(e => console.error('brightness error:', e));
        }

        let _shutdownAt = null;

        function updateShutdownDisplay() {
            const countdown = document.getElementById('shutdown-countdown');
            const cancelBtn = document.getElementById('shutdown-cancel-btn');
            if (!_shutdownAt) {
                countdown.style.display = 'none';
                cancelBtn.style.display = 'none';
                return;
            }
            const remaining = Math.max(0, Math.round(_shutdownAt - Date.now() / 1000));
            const m = Math.floor(remaining / 60);
            const s = remaining % 60;
            countdown.textContent = `Shutdown in ${m}m ${String(s).padStart(2,'0')}s`;
            countdown.style.display = 'block';
            cancelBtn.style.display = 'block';
        }

        function setShutdownTimer() {
            const m = parseInt(document.getElementById('shutdown-minutes').value);
            if (!m || m < 1) return;
            fetch('/shutdown-timer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({minutes: m})
            }).then(r => r.json()).then(data => {
                if (data.ok) { _shutdownAt = data.shutdown_at; updateShutdownDisplay(); }
            });
        }

        function cancelShutdownTimer() {
            fetch('/shutdown-cancel', {method: 'POST'})
                .then(r => r.json())
                .then(() => { _shutdownAt = null; updateShutdownDisplay(); });
        }

        function toggleSettings() {
            document.getElementById('settings-panel').classList.toggle('open');
        }

        document.addEventListener('click', function(e) {
            const panel = document.getElementById('settings-panel');
            const title = document.querySelector('header h1');
            if (panel.classList.contains('open') &&
                !panel.contains(e.target) && !title.contains(e.target)) {
                panel.classList.remove('open');
            }
        });

        function stopApp(id, btn) {
            const orig = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            fetch('/stop/' + id, {method: 'POST'})
                .then(() => {
                    btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                    setTimeout(() => btn.innerHTML = orig, 2000);
                })
                .catch(() => btn.innerHTML = orig);
        }

        function stopAll(card) {
            card.style.opacity = '0.5';
            card.style.pointerEvents = 'none';
            fetch('/stop-all', {method: 'POST'}).catch(() => {});
        }

        function launch(id, enabled) {
            if (!enabled) return;
            fetch('/launch/' + id, {method: 'POST'})
                .catch(e => console.error('launch error:', e));
        }


        function updateGpsBadge(gps) {
            if (!gps) return;
            const dot  = document.getElementById('gps-dot');
            const sats = document.getElementById('gps-sats');
            if (!dot) return;
            dot.className    = gps.ok ? 'fix' : 'nofix';
            sats.textContent = gps.sats ? gps.sats + ' sat' + (gps.sats !== 1 ? 's' : '') : '';
        }
        function updateCdapBadge(cdap) {
            if (!cdap) return;
            const btn  = document.getElementById('cdap-btn');
            const ssid = document.getElementById('cdap-ssid');
            if (!btn) return;
            btn.disabled = false;
            if (cdap.to_cdap) {
                btn.textContent       = 'Disconnect from CD-AP';
                btn.style.background  = 'rgba(74,184,222,0.15)';
                btn.style.borderColor = 'var(--accent)';
                ssid.textContent      = cdap.ssid;
            } else {
                btn.textContent       = 'Connect to CD-AP';
                btn.style.background  = 'rgba(255,255,255,0.04)';
                btn.style.borderColor = 'rgba(255,255,255,0.1)';
                ssid.textContent      = cdap.connected ? cdap.ssid : '';
            }
        }
        async function toggleCdap() {
            const btn = document.getElementById('cdap-btn');
            const msg = document.getElementById('cdap-msg');
            btn.disabled = true; msg.textContent = 'Working…';
            try {
                const r = await fetch('/toggle-cdap', { method: 'POST' });
                const d = await r.json();
                msg.textContent = r.ok ? (d.status === 'connected' ? 'Connected to CD-AP ✓' : 'Disconnected') : ('Error: ' + (d.msg || r.status));
                setTimeout(() => { msg.textContent = ''; }, 3000);
                updateStatus();
            } catch(e) {
                msg.textContent = 'Error';
                setTimeout(() => { msg.textContent = ''; btn.disabled = false; }, 3000);
            }
        }
        function updateStatus() {
            fetch('/status')
                .then(r => r.json())
                .then(data => {
                    if (data.date) document.getElementById('date').textContent = data.date;
                    Object.keys(data).forEach(key => {
                        const dot = document.getElementById('dot-' + key);
                        if (!dot) return;
                        dot.className = 'status-dot' + (data[key] === true ? ' online' : '');
                    });
                    _shutdownAt = data.shutdown_at || null;
                    updateGpsBadge(data.gps);
                    updateCdapBadge(data.cdap);
                })
                .catch(e => console.error('status error:', e));
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                String(now.getHours()).padStart(2,'0') + ':' +
                String(now.getMinutes()).padStart(2,'0') + ':' +
                String(now.getSeconds()).padStart(2,'0');
            updateShutdownDisplay();
        }

        updateStatus();
        setInterval(updateStatus, 5000);
        updateClock();
        setInterval(updateClock, 1000);

        buildSwatches();
        const savedAccent = localStorage.getItem('hd_accent');
        if (savedAccent) applyAccentColor(savedAccent);

        const savedBrightness = localStorage.getItem('hd_brightness');
        if (savedBrightness) {
            document.getElementById('brightness-slider').value = savedBrightness;
            onBrightnessSlider(savedBrightness);
            applyBrightness(savedBrightness);
        }
    </script>
</body>
</html>
